services:
  app:
    image: mcr.microsoft.com/devcontainers/python:2-3.14-trixie
    working_dir: /workspaces/backend
    volumes:
      - .:/workspaces/backend:cached
    command: sleep infinity
    depends_on:
      - life-log-db
    environment:
      - DB_HOST=life-log-db
    ports:
      - "8000:8000"

  life-log-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifelog_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d lifelog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
