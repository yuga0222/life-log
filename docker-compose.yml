version: '3'

services:
  db:
    image: mysql:8.0
    platform: linux/x86_64
    container_name: life-log-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: lifelog_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: